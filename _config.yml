# Site
name: "Constant Vigillance"
title: "Blog by Clay"
description: "Pwn, Pun, Parent - My (pseudo)random thoughts on hacking and cybersecurity"
logo: 'assets/images/logo.jpg'
favicon: 'assets/images/logo.jpg'
#baseurl: /mediumish-theme-jekyll
#baseurl: 
disqus: 'demowebsite'
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  clay:
    name: Clay
    display_name: Clay
    gravatar: a0085f78b754f2d4daae046431fa9b0f
    email: wcmoody@gmail.com
    web: https://www.wclaymoody.com
    twitter: https://twitter.com/wclaymoody
    description: "Identify, educate, empower, and inspire technical talent to solve the biggest challenges"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
